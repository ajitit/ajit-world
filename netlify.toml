[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# NOTE: apex ajit.world is NOT this site — it's routed elsewhere (homelab platform)
# via Cloudflare DNS. This site lives at www.ajit.world only. No apex redirect here.
